services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/tracking.sqlite3
      CARRIER_CONFIG_PATH: /app/config/carriers.json
    volumes:
      - tracking-data:/app/data
      - ./config:/app/config:ro
    stop_grace_period: 5m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tracking-data:
